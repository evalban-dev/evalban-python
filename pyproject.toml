[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalban"
version = "0.1.0"
description = "Send eval runs and production feedback to Evalban, the board that knows when your model got worse."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Evalban", email = "hello@evalban.com" }]
keywords = ["evals", "llm", "machine learning", "regression testing", "project management"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://evalban.com"

[project.scripts]
evalban = "evalban:_cli"

[tool.setuptools.packages.find]
where = ["src"]
